name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  learning-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pytest && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q

  ros2-build:
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+
